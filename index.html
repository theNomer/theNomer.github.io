<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>deNomer.fun</title>
  <style>
    :root {
      --bg: #fdf6ee;
      --ink: #1d1a2b;
      --muted: #5e5a72;
      --accent: #e0306a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17142a;
        --ink: #f6efe6;
        --muted: #a9a3c2;
        --accent: #ff6b9a;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2rem clamp(1.25rem, 8vw, 6rem);
    }
    h1 {
      font-size: clamp(2.75rem, 11vw, 6.5rem);
      line-height: 1;
      letter-spacing: -0.03em;
      margin: 0 0 1.25rem;
      font-weight: 800;
    }
    .status {
      font-size: 1.25rem;
      color: var(--muted);
      margin: 0 0 3rem;
    }
    .games {
      font-size: 1.125rem;
      margin: 0;
    }
    a {
      color: var(--accent);
      font-weight: 600;
      text-underline-offset: 0.2em;
    }
    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <header>
    <h1>deNomer.fun</h1>
  </header>
  <main>
    <p class="status">Main page in progress</p>
    <p class="games">
      Party games by Nomer:
      <a href="https://partycorner.denomer.fun">partycorner.denomer.fun</a>
    </p>
  </main>
</body>
</html>
